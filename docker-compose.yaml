services:
  postgres:
    image: postgres:17.9-alpine
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - boilerplate-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Uncomment to use redis
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - 6379:6379

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # The selected environment file, injected into the container.
    # Defaults to env/.env.local when ENV_FILE is not set.
    env_file:
      - ${ENV_FILE:-./env/.env.local}
    environment:
      # Vietnam local time, for logs and anything the process formats itself.
      #
      # The IANA name, never "UTC+7": in a POSIX TZ string the sign is
      # inverted, so TZ=UTC+7 means seven hours *west* of UTC and would put
      # the container on UTC-7 — fourteen hours off, in the wrong direction.
      #
      # Safe to set only because every timestamp column is now `timestamptz`
      # (migration 1787200000000). While they were `timestamp without time
      # zone` the pg driver parsed each one in the process's local zone, so
      # this single line would have shifted every date the API reads by seven
      # hours. Postgres itself stays on UTC: date bucketing names its zone
      # explicitly in SQL, because implicit conversion is what caused that
      # problem in the first place.
      TZ: Asia/Ho_Chi_Minh
    ports:
      - ${APP_PORT}:${APP_PORT}
    volumes:
      # FILE_DRIVER=local writes here; without a volume every uploaded file is
      # lost when the container is rebuilt.
      - boilerplate-uploads:/usr/src/app/upload

volumes:
  boilerplate-db:
  boilerplate-uploads:
